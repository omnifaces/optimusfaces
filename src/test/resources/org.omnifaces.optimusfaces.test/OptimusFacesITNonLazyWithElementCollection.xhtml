<!DOCTYPE html>
<html lang="en"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:o="omnifaces"
    xmlns:p="primefaces"
    xmlns:op="optimusfaces"
>
    <h:head>
        <title>OptimusFacesIT - non-lazy with element collection</title>
    </h:head>

    <h:body>
        <o:importConstants type="org.omnifaces.optimusfaces.test.model.Group" />

        <o:form id="form">
            <op:dataTable id="table" value="#{optimusFacesITNonLazyWithElementCollectionBean.nonLazyGroupies}" searchable="true">
                <op:column field="id" />
                <op:column field="email" />
                <op:column field="gender" />
                <op:column field="groups" sortable="false" /> <!-- TODO: support sorting as well. -->
            </op:dataTable>

            <h:selectManyCheckbox id="groups" value="#{optimusFacesITNonLazyWithElementCollectionBean.selectedGroups}" converter="omnifaces.GenericEnumConverter">
                <f:selectItems value="#{Group}" />
                <f:ajax render="table :rowCount" />
            </h:selectManyCheckbox>
        </o:form>

        <h:outputText id="rowCount" value="#{optimusFacesITNonLazyWithElementCollectionBean.nonLazyGroupies.rowCount}" styleClass="updateOnDataTableFilter" />
    </h:body>
</html>
