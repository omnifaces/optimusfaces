name: develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Test ${{matrix.server}} + ${{matrix.database}}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        server: [wildfly-hibernate, glassfish-eclipselink, tomee-openjpa]
        database: [H2, MySQL, PostgreSQL, SQLServer]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven

    - name: Set up MySQL (already provided by ubuntu-latest)
      if: matrix.database == 'MySQL'
      run: |
        sudo /etc/init.d/mysql start
        mysql -u root -proot -e 'CREATE DATABASE test;'

    - name: Set up PostgreSQL (already provided by ubuntu-latest)
      if: matrix.database == 'PostgreSQL'
      run: |
        sudo systemctl start postgresql.service
        sudo -u postgres psql postgres -c "CREATE DATABASE test;"
        sudo -u postgres psql postgres -c "CREATE USER test WITH ENCRYPTED PASSWORD 'test';"
        sudo -u postgres psql postgres -c "GRANT ALL PRIVILEGES ON DATABASE test TO test;"
        sudo -u postgres psql postgres -c "\c test postgres" -c "GRANT ALL ON SCHEMA public TO test;"

    - name: Set up SQL Server (via Microsoft's Docker image)
      if: matrix.database == 'SQLServer'
      run: |
        docker run -d --name sqlserver \
          -e SA_PASSWORD="PassW0rd!" \
          -e ACCEPT_EULA="Y" \
          -e MSSQL_PID="Developer" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2022-latest
        for i in {1..10}; do
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "PassW0rd!" -No -Q "SELECT 1" && break
          echo "Waiting for SQL Server to be ready... ($i/10)"
          sleep 3
        done
        docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "PassW0rd!" -No \
          -Q "CREATE DATABASE test; CREATE LOGIN test WITH PASSWORD = 'PassW0rd!';"
        docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "PassW0rd!" -No -d test \
          -Q "CREATE USER test FOR LOGIN test; ALTER ROLE db_owner ADD MEMBER test;"

    - name: Test with Maven
      run: mvn -B verify -DskipUTs=false -DskipITs=false -Dmaven.javadoc.skip=true -Dit.test=OptimusFaces${{matrix.database}}IT -P ${{matrix.server}}
