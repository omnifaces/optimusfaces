name: tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test ${{matrix.server}}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        server: [wildfly-hibernate, glassfish-eclipselink, tomee-openjpa]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven

    - name: Test with Maven
      run: mvn -B -U verify -DskipUTs=false -DskipITs=false -Dmaven.javadoc.skip=true -P ${{matrix.server}}
