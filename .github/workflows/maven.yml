name: tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test ${{matrix.server}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [wildfly-hibernate, glassfish-eclipselink, tomee-openjpa]

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test with Maven
      run: mvn -B -U verify -DskipUTs=false -DskipITs=false -Dmaven.javadoc.skip=true -P ${{matrix.server}}

  deploy:
    name: Deploy SNAPSHOT
    needs: test
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username-env-var: CENTRAL_USERNAME
        server-password-env-var: CENTRAL_PASSWORD
    - name: Extract project version
      id: project
      run: echo version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) >> $GITHUB_OUTPUT
    - name: Deploy with Maven
      if: ${{endsWith(steps.project.outputs.version, '-SNAPSHOT')}}
      run: mvn -B clean deploy -Dmaven.test.skip=true
      env:
        CENTRAL_USERNAME: ${{secrets.CENTRAL_USERNAME}}
        CENTRAL_PASSWORD: ${{secrets.CENTRAL_PASSWORD}}
